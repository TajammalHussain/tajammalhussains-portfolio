name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest run per branch/PR needs to finish — cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, unit + integration + E2E tests, Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      # Needed for: build-time Mermaid SVG rendering, OG image generation,
      # and the Playwright E2E suite itself.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck (frontend)
        run: npm run typecheck

      - name: Typecheck (worker)
        run: npm run typecheck
        working-directory: worker

      - name: Unit tests + coverage (pipeline logic, ≥80% threshold enforced by vitest.config.ts)
        run: npm run test:coverage

      # These hit the real external APIs (api.carbonintensity.org.uk,
      # landregistry.data.gov.uk) — deliberately, per this project's "no
      # mocks where a real check is possible" approach. A transient failure
      # here most likely means one of those services is down, not a code bug.
      - name: Worker integration tests (Miniflare — D1, R2, KV, real external APIs)
        run: npm run test:integration
        working-directory: worker

      - name: Build site (includes OG image generation + Mermaid SVG rendering)
        run: npm run build

      - name: E2E tests (Playwright, desktop + mobile, axe-core accessibility)
        run: npm run test:e2e

      - name: Lighthouse CI (performance, accessibility, best practices, SEO — ≥95 all four)
        run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
