name = "portfolio-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ─── Custom domain ──────────────────────────────────────────────────────────
# Routes api.tajammalhussains.uk to this Worker. Requires the zone
# (tajammalhussains.uk) to already be active on this Cloudflare account —
# `custom_domain = true` has Cloudflare provision the DNS record and TLS
# cert automatically, rather than needing a manually-created CNAME.
[[routes]]
pattern = "api.tajammalhussains.uk"
custom_domain = true

# ─── Cron Triggers ────────────────────────────────────────────────────────────
# Cloudflare passes the matching cron expression as `event.cron` into the
# scheduled() handler, which dispatches to the right pipeline (see src/index.ts).
[triggers]
crons = [
  "*/30 * * * *", # Pipeline 1 — Carbon Intensity, every 30 minutes
  "0 6 1 * *",     # Pipeline 2 — Housing, monthly on the 1st at 06:00 UTC
  "0 5 * * *",     # Pipeline 3 — Site meta-pipeline, daily at 05:00 UTC
]

# ─── D1 (bronze ingestion log, silver, gold, quality, audit) ───────────────────
# `database_id` is a placeholder until `wrangler d1 create portfolio_db` is run
# against a real Cloudflare account — see ARCHITECTURE.md for the deploy steps.
# Local dev (`wrangler dev` / `wrangler d1 migrations apply --local`) works
# against a fully local SQLite file regardless of this value.
[[d1_databases]]
binding = "DB"
database_name = "portfolio_db"
database_id = "5b3cf647-dfe9-4d64-a107-a8a2b238f2ec"
migrations_dir = "migrations"

# ─── R2 (bronze raw payload landing zone) ──────────────────────────────────────
[[r2_buckets]]
binding = "BRONZE_BUCKET"
bucket_name = "portfolio-bronze"

# ─── KV (public API response cache) ────────────────────────────────────────────
[[kv_namespaces]]
binding = "CACHE_KV"
id = "0827e770dc9d46a9bb88640ea157d387"

# ─── Non-secret vars ────────────────────────────────────────────────────────────
# ENVIRONMENT is "production" here deliberately: `deploy` runs plain
# `wrangler deploy` with no --env flag, so this top-level [vars] block is
# exactly what ships to production — there is no separate named environment
# overriding it. verifyAccess() (src/lib/access.ts) only skips real
# Cloudflare Access verification when ENVIRONMENT === "development"; leaving
# this as "development" here would mean a production deploy with Access not
# yet configured fails OPEN (anyone gets an authenticated admin session)
# instead of failing closed (401). For local `wrangler dev`, set
# ENVIRONMENT=development in worker/.dev.vars (gitignored, never committed —
# see .dev.vars.example) to restore the local convenience bypass.
[vars]
ENVIRONMENT = "production"
# Guardrails so a runaway job cannot exceed Cloudflare's free-tier limits
# (see README for the specific numbers assumed).
MAX_BACKFILL_DAYS_PER_RUN = "31"
API_CACHE_TTL_SECONDS = "300"
ADMIN_ALLOWED_ORIGINS = "https://tajammalhussains.uk,http://localhost:4321"
# Set once a real GitHub OAuth App exists for the /admin/content CMS (see
# worker/src/routes/oauth.ts) — client ID is public, safe as a plain var.
# GITHUB_OAUTH_CLIENT_ID = "REPLACE_WITH_REAL_CLIENT_ID"

# ─── Secrets (set via `wrangler secret put NAME`, never committed) ─────────────
# CF_ACCESS_TEAM_DOMAIN
# CF_ACCESS_AUD
# GITHUB_OAUTH_CLIENT_SECRET
# META_INGEST_SECRET — bearer token CI presents to POST /api/meta/report-event
